# ==============================================================================
# Hostinger VPS Nginx Configuration (Reverse Proxy & Static Cache)
# Domain: subhartiuniversity.com / www.subhartiuniversity.com
# Path on Ubuntu VPS: /etc/nginx/sites-available/subhartiuniversity.com
# ==============================================================================

server {
    listen 80;
    server_name subhartiuniversity.com www.subhartiuniversity.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name subhartiuniversity.com www.subhartiuniversity.com;

    # SSL Certificates (Installed via: sudo certbot --nginx -d subhartiuniversity.com -d www.subhartiuniversity.com)
    # ssl_certificate /etc/letsencrypt/live/subhartiuniversity.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/subhartiuniversity.com/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript font/woff2 image/svg+xml;

    # Redirect root to /login/StudentLogin for official student login
    location = / {
        return 302 /login/StudentLogin;
    }

    # Root to Node.js / PM2 Cluster
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Direct Static Assets Cache
    location /assets/ {
        proxy_pass http://127.0.0.1:5001/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
